version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: pitang-db
    environment:
      POSTGRES_USER: pitang
      POSTGRES_PASSWORD: pitang123
      POSTGRES_DB: reimbursement
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - pitang-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitang -d reimbursement"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pitang-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pitang:pitang123@db:5432/reimbursement?schema=public
      JWT_SECRET: your-secret-key-here-change-in-production
      PORT: 3333
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pitang-network
    command: >
      sh -c "npx prisma migrate deploy && 
             npm run seed || true && 
             npm start"

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pitang-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - pitang-network

volumes:
  postgres_data:

networks:
  pitang-network:
    driver: bridge
